[project]
name = "baseten-comparison"
version = "0.1.0"
description = "Compare web-search providers behind Baseten server tools on SimpleQA and AA-Omniscience"
authors = [{ name = "Ilya Gusev", email = "ilya.gusev@keenable.ai" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.50",
    "fire>=0.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
bench = "baseten_comparison.cli:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
